[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jetbns"
version = "0.1.0"
description = "Tested models for relativistic-jet propagation through binary-neutron-star merger ejecta"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Eduardo M. Gutierrez" }]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
hdf5 = ["h5py>=3.8"]
dev = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jetbns"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
